name: Recogida horaria

on:
  schedule:
    - cron: "17 * * * *"   # cada hora (UTC)
    - cron: "47 * * * *"   # refuerzo: GitHub retrasa/salta crons en repos nuevos
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Recoger realidad + previsiones, calibrar y generar dashboard
        env:
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
        timeout-minutes: 20
        run: python -m src.run collect
      - name: Guardar datos
        if: always()
        run: |
          git config user.name "spot-forecast-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "datos $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -X ours || true
          git push
