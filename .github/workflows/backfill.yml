name: Histórico inicial (manual)

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Fecha de inicio (AAAA-MM-DD)"
        default: "2025-01-01"

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Descargar histórico y calibrar
        env:
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
        timeout-minutes: 45
        run: python -m src.run backfill --start "${{ github.event.inputs.start }}"
      - name: Guardar datos
        if: always()
        run: |
          git config user.name "spot-forecast-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "histórico desde ${{ github.event.inputs.start }}"
          git pull --rebase -X ours || true
          git push
